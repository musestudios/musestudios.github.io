<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse Studios</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Muse Studios — stories no one wants to tell. A production house for Global South stories, London · Islamabad.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap');
/* ============================================================
   MUSE STUDIOS — DESIGN TOKENS
   colors_and_type.css
   ============================================================ */

/* ---------- WEBFONTS (Google Fonts substitution) ---------- */
:root {
  /* ============================================================
     COLOR TOKENS — base scale
     ============================================================ */

  /* Ink — deep warm black, the primary text/UI color */
  --ink:           #0E0D0B;
  --ink-90:        #1A1815;
  --ink-80:        #2A2722;
  --ink-60:        #4D4842;
  --ink-40:        #807A72;
  --ink-20:        #B8B2A8;
  --ink-10:        #D9D3C8;
  --ink-05:        #ECE6DB;

  /* Cream — paper, primary background. Kept LIGHT — paper is the default base. */
  --cream:         #FAF5EA;
  --cream-soft:    #F7F1E5;
  --cream-deep:    #EFE7D6;
  --paper:         #FCF8EF;

  /* Retro light bases — faded, low-chroma tints that broaden the light register.
     Used as alternate large surfaces for a warmer, mid-century print feel. */
  --oat:           #ECDCBE;   /* warm butter sand */
  --mist:          #CFD9CF;   /* faded sage mist */
  --blush:         #ECD2C6;   /* dusty peach */
  --powder:        #CBD4DD;   /* faded powder blue */

  /* Ox-blood — cinematic red, used in large blocks */
  --oxblood:       #7A1E1E;
  --oxblood-deep:  #5A1313;
  --oxblood-soft:  #9A2828;

  /* Ochre — warm gold, secondary cinematic accent */
  --ochre:         #D9A441;
  --ochre-deep:    #A8761E;
  --ochre-soft:    #E8BE6B;

  /* Twilight — deep blue, night scenes / contrast */
  --twilight:      #1B2A4E;
  --twilight-deep: #0F1A33;
  --twilight-soft: #2D406B;

  /* Signal — record-light red. RESERVED for live / primary CTA */
  --signal:        #FF3B1F;
  --signal-deep:   #D72A0F;

  /* Sage — rare cool accent, used only on tool surfaces */
  --sage:          #6E8B6A;

  /* Jade + Iris — whimsical pops (blues & greens) */
  --jade:          #3FA37A;
  --jade-deep:     #2C7355;
  --jade-soft:     #6FC09B;
  --iris:          #5B6FE0;
  --iris-deep:     #3D4FB0;
  --iris-soft:     #8B99EC;

  /* ============================================================
     SEMANTIC COLOR TOKENS
     ============================================================ */

  /* Foregrounds (text) */
  --fg-1:          var(--ink);            /* primary text */
  --fg-2:          var(--ink-80);         /* secondary text */
  --fg-3:          var(--ink-60);         /* tertiary / metadata */
  --fg-4:          var(--ink-40);         /* disabled / very low */
  --fg-on-ink:     var(--cream);          /* text on dark surfaces */
  --fg-on-image:   var(--cream);          /* text on imagery */
  --fg-accent:     var(--oxblood);        /* emphasis links / accent text */
  --fg-signal:     var(--signal);         /* live / urgent */

  /* Backgrounds */
  --bg-1:          var(--cream);          /* primary surface */
  --bg-2:          var(--paper);          /* raised paper surface */
  --bg-3:          var(--cream-deep);     /* sunken / pressed */
  --bg-ink:        var(--ink);            /* dark / tool surface */
  --bg-ink-2:      var(--ink-90);         /* dark raised */
  --bg-ink-3:      var(--ink-80);         /* dark sunken */
  --bg-oxblood:    var(--oxblood);        /* large block — service intro */
  --bg-twilight:   var(--twilight);       /* large block — night / dramatic */
  --bg-ochre:      var(--ochre);          /* large block — warm accent */

  /* Borders */
  --border:        var(--ink);            /* default 1px ink */
  --border-soft:   var(--ink-20);         /* subdued */
  --border-on-ink: var(--cream);          /* on dark surfaces */

  /* States */
  --hover-shade:   rgba(14, 13, 11, 0.08);
  --press-shade:   rgba(14, 13, 11, 0.16);
  --focus-ring:    var(--ink);

  /* ============================================================
     TYPOGRAPHY TOKENS
     ============================================================ */

  /* Families */
  --font-display:  'Instrument Serif', 'Times New Roman', serif;
  --font-sans:     'Space Grotesk', 'Helvetica Neue', sans-serif;
  --font-mono:     'JetBrains Mono', 'Menlo', monospace;

  /* Type scale — 1.333 (perfect fourth) */
  --text-xs:       11px;
  --text-sm:       13px;
  --text-base:     16px;
  --text-md:       18px;
  --text-lg:       22px;
  --text-xl:       28px;
  --text-2xl:      40px;
  --text-3xl:      56px;
  --text-4xl:      80px;
  --text-5xl:      112px;
  --text-6xl:      160px;

  /* Line heights */
  --lh-tight:      0.92;  /* @kind other */
  --lh-snug:       1.05;  /* @kind other */
  --lh-normal:     1.4;   /* @kind other */
  --lh-loose:      1.6;   /* @kind other */

  /* Letter-spacing */
  --tracking-tight: -0.025em;
  --tracking-normal: 0;
  --tracking-wide:  0.04em;
  --tracking-mega:  0.16em;  /* for ALLCAPS labels */

  /* Weights */
  --weight-light:    300;
  --weight-normal:   400;
  --weight-medium:   500;
  --weight-semibold: 600;
  --weight-bold:     700;

  /* ============================================================
     SPACING / RHYTHM
     ============================================================ */
  --space-0:   0px;
  --space-1:   4px;
  --space-2:   8px;
  --space-3:   12px;
  --space-4:   16px;
  --space-5:   24px;
  --space-6:   32px;
  --space-7:   48px;
  --space-8:   64px;
  --space-9:   96px;
  --space-10:  128px;
  --space-11:  192px;
  --space-12:  256px;

  /* ============================================================
     RADII / BORDERS / SHADOWS
     ============================================================ */
  --radius-0:    0px;       /* default — square */
  --radius-1:    2px;       /* chips/tags only */
  --radius-pill: 999px;     /* avatars, dot indicators only */

  --border-1:    1px solid var(--ink);
  --border-2:    2px solid var(--ink);
  --border-soft-1: 1px solid var(--ink-20);
  --border-on-ink-1: 1px solid var(--cream);

  /* The ONE shadow allowed (input insets) */
  --shadow-inset: inset 0 0 0 1px rgba(14, 13, 11, 0.08);

  /* ============================================================
     MOTION
     ============================================================ */
  --ease-mech:    cubic-bezier(0.2, 0.7, 0.1, 1);  /* @kind other */
  --ease-quick:   cubic-bezier(0.4, 0, 0.2, 1);    /* @kind other */
  --dur-micro:    180ms;  /* @kind other */
  --dur-base:     320ms;  /* @kind other */
  --dur-slow:     600ms;  /* @kind other */

  /* ============================================================
     LAYOUT
     ============================================================ */
  --content-max:    1280px;
  --gutter:         24px;
  --letterbox:      56px;     /* hero top/bottom black bars */
  --topbar:         64px;
  --timestrip:      32px;
}

/* ============================================================
   BASE TYPE — semantic element styles
   ============================================================ */

html {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  color: var(--fg-1);
  background: var(--bg-1);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  margin: 0;
  line-height: var(--lh-normal);
}

/* ----- Display headings — Instrument Serif ----- */
.h-display, h1.display, .hero-title {
  font-family: var(--font-display);
  font-size: var(--text-5xl);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  font-weight: var(--weight-normal);
}

.h-display-italic, .hero-quote {
  font-family: var(--font-display);
  font-style: italic;
  font-size: var(--text-4xl);
  line-height: var(--lh-snug);
  letter-spacing: var(--tracking-tight);
  font-weight: var(--weight-normal);
}

h1, .h1 {
  font-family: var(--font-display);
  font-size: var(--text-4xl);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  font-weight: var(--weight-normal);
  margin: 0 0 var(--space-5) 0;
}

h2, .h2 {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  line-height: var(--lh-snug);
  letter-spacing: var(--tracking-tight);
  font-weight: var(--weight-normal);
  margin: 0 0 var(--space-4) 0;
}

h3, .h3 {
  font-family: var(--font-sans);
  font-size: var(--text-xl);
  line-height: var(--lh-snug);
  font-weight: var(--weight-semibold);
  margin: 0 0 var(--space-3) 0;
}

h4, .h4 {
  font-family: var(--font-sans);
  font-size: var(--text-lg);
  font-weight: var(--weight-medium);
  margin: 0 0 var(--space-2) 0;
}

p, .body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--lh-loose);
  color: var(--fg-1);
  margin: 0 0 var(--space-4) 0;
  text-wrap: pretty;
}

.lead {
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: var(--lh-normal);
  color: var(--fg-2);
}

.small, small {
  font-size: var(--text-sm);
  color: var(--fg-3);
}

/* ----- Mono / metadata register ----- */
.meta, .timecode, code, kbd, .label-mono {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  letter-spacing: var(--tracking-normal);
  color: var(--fg-3);
}

.timecode {
  color: var(--fg-1);
  font-feature-settings: "tnum" 1;
}

/* ----- Eyebrow / overline ----- */
.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-mega);
  text-transform: uppercase;
  color: var(--fg-3);
  font-weight: var(--weight-medium);
}

/* ----- Links ----- */
a {
  color: var(--fg-1);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color var(--dur-micro) var(--ease-mech);
}
a:hover {
  border-bottom-color: var(--ink);
}
a.signal {
  color: var(--fg-signal);
}

/* ----- Selection ----- */
::selection {
  background: var(--ink);
  color: var(--cream);
}

/* ============================================================
   UTILITY CLASSES
   ============================================================ */

.surface-ink   { background: var(--bg-ink);     color: var(--fg-on-ink); }
.surface-cream { background: var(--bg-1);        color: var(--fg-1); }
.surface-oxblood { background: var(--bg-oxblood); color: var(--cream); }
.surface-ochre  { background: var(--bg-ochre);   color: var(--ink); }
.surface-twilight { background: var(--bg-twilight); color: var(--cream); }

.frame-corners {
  position: relative;
}
.frame-corners::before,
.frame-corners::after {
  content: "";
  position: absolute;
  width: 12px; height: 12px;
  border: 1px solid currentColor;
  pointer-events: none;
  transition: all var(--dur-micro) var(--ease-mech);
}
.frame-corners::before {
  top: 6px; left: 6px;
  border-right: none; border-bottom: none;
}
.frame-corners::after {
  bottom: 6px; right: 6px;
  border-left: none; border-top: none;
}
.frame-corners:hover::before,
.frame-corners:hover::after {
  width: 16px; height: 16px;
  border-width: 2px;
}

/* Recording pulse */
@keyframes recpulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.rec-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: var(--radius-pill);
  background: var(--signal);
  animation: recpulse 1.2s var(--ease-mech) infinite;
}

/* Frame-advance reveal */
@keyframes frame-advance {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.advance-in {
  animation: frame-advance var(--dur-base) var(--ease-mech) both;
}

/* Marketing site shared styles */


* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); }
body { font-family: var(--font-sans); }
button { font-family: inherit; cursor: pointer; }
a { cursor: pointer; }

.container { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

/* Top bar */
.topbar {
  background: var(--ink); color: var(--cream);
  padding: 18px 32px; display:flex; align-items:center; gap:32px;
  position: sticky; top: 0; z-index: 50;
  border-bottom: 1px solid var(--ink);
}
.brand-lockup { display:flex; align-items:center; gap:12px; border-bottom:none !important; }
.topbar .brand { font-family: var(--font-display); font-style:italic; font-size:38px; line-height:0.9; letter-spacing:-0.02em; color: var(--cream); }
.topbar .brand-dot { width:7px; height:7px; border-radius:999px; background: var(--signal); align-self:flex-start; margin-top:8px; }
.brand-stack { display:flex; flex-direction:column; gap:2px; }
.topbar .brand-tag { font-family: var(--font-mono); font-size:11px; letter-spacing:0.28em; color: var(--cream); font-weight:500; }
.topbar .brand-sub { font-family: var(--font-mono); font-size:8px; letter-spacing:0.2em; color: var(--ink-40); }
.topbar nav { display:flex; gap:28px; flex:1; justify-content:flex-end; align-items:center; }
.topbar nav a { color: var(--cream); border-bottom: 1px solid transparent; padding:6px 0; font-size:14px; transition: border-color 180ms var(--ease-mech); }
.topbar nav a:hover, .topbar nav a.active { border-bottom-color: var(--cream); }
.topbar .live-pill { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border:1px solid var(--cream); border-radius:2px; white-space:nowrap; }
.topbar .live-pill .meta { color: var(--cream); font-size:10px; letter-spacing:0.16em; text-transform:uppercase; }

/* Footer */
.foot { background: var(--ink); color: var(--cream); padding: 64px 32px 32px; margin-top: 96px; }
.foot .foot-grid { max-width: 1280px; margin: 0 auto; display:grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; }
.foot h4 { font-family: var(--font-mono); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color: var(--ink-20); margin: 0 0 16px 0; font-weight: 500; }
.foot a { color: var(--cream); display:block; padding: 4px 0; font-size: 14px; }
.foot .endline { max-width: 1280px; margin: 48px auto 0; padding-top: 24px; border-top: 1px solid var(--ink-80); display:flex; justify-content:space-between; }
.foot .endline span { font-family: var(--font-mono); font-size: 11px; color: var(--ink-40); letter-spacing:0.08em; }

/* Buttons */
.btn { font-family: var(--font-sans); font-size: 14px; font-weight: 500; padding: 12px 20px; border: 1px solid var(--ink); background: transparent; color: var(--ink); transition: all 180ms var(--ease-mech); display:inline-flex; align-items:center; gap:10px; }
.btn:hover { background: var(--ink); color: var(--cream); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--ink); color: var(--cream); }
.btn.primary:hover { background: var(--ink-90); }
.btn.signal { background: var(--signal); color: var(--ink); border-color: var(--signal); font-weight: 600; }
.btn.signal:hover { background: var(--signal-deep); border-color: var(--signal-deep); color: var(--cream); }
.btn.cream { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.btn.cream:hover { background: transparent; color: var(--cream); border-color: var(--cream); }

/* Eyebrow + meta */
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing:0.16em; text-transform:uppercase; color: var(--fg-3); font-weight: 500; }
.eyebrow.on-ink { color: var(--ink-20); }

/* Frame card */
.frame-card { position: relative; border: 1px solid var(--ink); padding: 18px; transition: all 180ms var(--ease-mech); }
.frame-card::before, .frame-card::after { content:""; position:absolute; width:14px; height:14px; pointer-events:none; transition: all 180ms var(--ease-mech); }
.frame-card::before { top:-1px; left:-1px; border-left:2px solid var(--ink); border-top:2px solid var(--ink); }
.frame-card::after { bottom:-1px; right:-1px; border-right:2px solid var(--ink); border-bottom:2px solid var(--ink); }
.frame-card:hover::before, .frame-card:hover::after { width:20px; height:20px; }

/* Letterbox hero */
.letterbox {
  position: relative; background: var(--ink); color: var(--cream);
  padding: 56px 0;
  overflow: hidden;
}
.letterbox-bar {
  position: absolute; left:0; right:0; height: 32px; background: #000;
  display:flex; align-items:center; padding: 0 32px; gap:16px; z-index:5;
}
.letterbox-bar.top { top: 0; }
.letterbox-bar.bottom { bottom: 0; }
.letterbox-bar .meta { font-family: var(--font-mono); font-size: 11px; color: var(--cream); letter-spacing: 0.12em; }

/* Frame brackets at section corners */
.section-frame { position: relative; }
.section-frame::before, .section-frame::after,
.section-frame > .br-tl, .section-frame > .br-tr,
.section-frame > .br-bl, .section-frame > .br-br { display: none; }

.corner-marks { position: absolute; pointer-events: none; }
.corner-marks span { position: absolute; width: 18px; height: 18px; }
.corner-marks .tl { top: 0; left: 0; border-top: 1px solid currentColor; border-left: 1px solid currentColor; }
.corner-marks .tr { top: 0; right: 0; border-top: 1px solid currentColor; border-right: 1px solid currentColor; }
.corner-marks .bl { bottom: 0; left: 0; border-bottom: 1px solid currentColor; border-left: 1px solid currentColor; }
.corner-marks .br { bottom: 0; right: 0; border-bottom: 1px solid currentColor; border-right: 1px solid currentColor; }

/* Sprocket strip */
.sprockets { display:flex; gap: 14px; }
.sprockets > span { width: 8px; height: 8px; background: currentColor; opacity: 0.4; }

/* Image slot fallback styles */
image-slot { background: var(--ink-10); }

/* ============================================================
   EDIT-SUITE HOME — production-tool chrome for the landing page
   ============================================================ */
.es-home { background: var(--ink); color: var(--cream); }

/* control / crumb strip (mirrors the studio topstrip) */
.es-strip {
  background: var(--ink-90); border-bottom: 1px solid var(--ink-80);
  display: flex; align-items: center; gap: 16px; padding: 0 24px; height: 40px;
}
.es-crumb { font-family: var(--font-mono); font-size: 11px; color: var(--ink-20); letter-spacing: 0.08em; }
.es-crumb b { color: var(--cream); font-weight: 500; }
.es-crumb .sep { color: var(--ink-60); margin: 0 8px; }
.es-tc { font-family: var(--font-mono); font-size: 12px; color: var(--cream); font-feature-settings:'tnum' 1; }
.es-recpill { display:inline-flex; align-items:center; gap:8px; padding:4px 10px; border:1px solid var(--signal); background: rgba(255,59,31,0.12); border-radius:2px; white-space:nowrap; }
.es-recpill .meta { font-family: var(--font-mono); font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color: var(--cream); }

/* mono eyebrow on dark */
.es-eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-40); white-space: nowrap; }

/* program monitor */
.es-monitor { position: relative; border: 1px solid var(--ink-60); overflow: hidden; }
.es-monitor .grad { position: absolute; inset: 0; }
.es-monitor .scan { position:absolute; inset:0; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px); pointer-events:none; opacity:0.5; }
.es-bracket { position: absolute; width: 22px; height: 22px; z-index: 4; }
.es-bracket.tl { top:14px; left:14px; border-top:2px solid var(--cream); border-left:2px solid var(--cream); }
.es-bracket.tr { top:14px; right:14px; border-top:2px solid var(--cream); border-right:2px solid var(--cream); }
.es-bracket.bl { bottom:14px; left:14px; border-bottom:2px solid var(--cream); border-left:2px solid var(--cream); }
.es-bracket.br { bottom:14px; right:14px; border-bottom:2px solid var(--cream); border-right:2px solid var(--cream); }

/* dark buttons (mirror studio dbtn) */
.es-btn { font-family: var(--font-sans); font-size: 13px; padding: 10px 16px; border: 1px solid var(--ink-60); background: transparent; color: var(--cream); cursor: pointer; transition: all 180ms var(--ease-mech); display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
.es-btn:hover { border-color: var(--cream); background: var(--ink-80); }
.es-btn.signal { background: var(--signal); color: var(--ink); border-color: var(--signal); font-weight:600; }
.es-btn.signal:hover { background: var(--signal-deep); color: var(--cream); border-color: var(--signal-deep); }
.es-btn.cream { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.es-btn.cream:hover { background: var(--ink-20); }
.es-btn:active { transform: scale(0.98); }

/* reel card (mirror studio reel-card) */
.es-reel { background: var(--ink-90); border: 1px solid var(--ink-80); transition: border-color 180ms var(--ease-mech); cursor: pointer; }
.es-reel:hover { border-color: var(--cream); }
.es-reel .thumb { position: relative; height: 220px; border-bottom: 1px solid var(--ink-80); overflow: hidden; }
.es-reel .thumb .grad { position:absolute; inset:0; }
.es-reel .thumb .scan { position:absolute; inset:0; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px); opacity:0.5; }

/* status chips */
.es-status { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 3px 8px; border: 1px solid; border-radius: 2px; display: inline-flex; align-items: center; gap: 6px; }
.es-status.dev { color: var(--ink-20); border-color: var(--ink-60); }
.es-status.shoot { color: var(--signal); border-color: var(--signal); background: rgba(255,59,31,0.08); }

/* scrubber */

.es-scrubber .ticks { position:absolute; left:12px; right:12px; top:6px; height:12px; display:flex; justify-content:space-between; pointer-events:none; }

   ============================================================ */
.frame-card, .es-monitor, .es-reel, .reel-card {

.es-monitor .grain-layer, .es-reel .thumb .grain-layer { opacity: 0.12; mix-blend-mode: soft-light; }

   ============================================================ */
@media (pointer: fine) {

}

.cursor-reticle .c-tl { top: 0; left: 0; border-top: 1.5px solid #fff; border-left: 1.5px solid #fff; }

.cursor-reticle.is-down { width: 22px; height: 22px; margin: -11px 0 0 -11px; }

/* ============================================================

   ============================================================ */

.page-fx .bar { position: absolute; left: 0; right: 0; height: 50%; background: #000; transform: scaleY(0); transition: transform 260ms var(--ease-mech); }
.page-fx .bar.top { top: 0; transform-origin: top; }
.page-fx .bar.bottom { bottom: 0; transform-origin: bottom; }

   so content stays visible even if the animation is frozen/backgrounded) */

@keyframes screen-in {

<script>
/**
 * <image-slot> — user-fillable image placeholder.
 *
 * Drop this into a deck, mockup, or page wherever you want the user to
 * supply an image. You control the slot's shape and size; the user fills it
 * by dragging an image file onto it (or clicking to browse). The dropped
 * image persists across reloads via a .image-slots.state.json sidecar —

 * design_canvas.jsx, so the filled slot shows on share links, downloaded
 * zips, and PPTX export. Outside the omelette runtime the slot is read-only.
 *
 * The host bridge only allows sidecar writes at the project root, so the
 * HTML that uses this component is assumed to live at the project root too
 * (same constraint as design_canvas.jsx).

 *   id           Persistence key. REQUIRED for the drop to survive reload —
 *                every slot on the page needs a distinct id.
 *   shape        'rect' | 'rounded' | 'circle' | 'pill'   (default 'rounded')

 *                hexagons, blobs, arbitrary polygons.

 *                enters a reframe mode: the whole image spills past the mask
 *                (translucent outside, opaque inside), drag to reposition,
 *                corner-drag to scale. The crop persists alongside the image
 *                in the sidecar. contain/fill stay static.
 *   position     object-position for fit=contain|fill.     (default '50% 50%')
 *   placeholder  Empty-state caption.                      (default 'Drop an image')
 *   src          Optional initial/fallback image URL. A user drop overrides
 *                it; clearing the drop reveals src again.
 *

 * inline or from a parent grid — so it composes with any layout.
 *
 * Usage:
 *   <script src="image-slot.js"><\/script>
 *   <image-slot id="hero"   style="width:800px;height:450px" shape="rounded" radius="20"
 *               placeholder="Drop a hero image"></image-slot>
 *   <image-slot id="avatar" style="width:120px;height:120px" shape="circle"></image-slot>
 *   <image-slot id="kite"   style="width:300px;height:300px"
 *               mask="polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"></image-slot>
 */

(() => {
  const STATE_FILE = '.image-slots.state.json';
  // 2× a ~600px slot in a 1920-wide deck — retina-sharp without making the
  // sidecar enormous. A 1200px WebP at q=0.85 is ~150-300KB.
  const MAX_DIM = 1200;
  // Raster formats only. SVG is excluded (can carry script; createImageBitmap
  // on SVG blobs is inconsistent). GIF is excluded because the canvas
  // re-encode keeps only the first frame, so an animated GIF would silently
  // go still — better to reject than surprise.
  const ACCEPT = ['image/png', 'image/jpeg', 'image/webp', 'image/avif'];

  // ── Shared sidecar store ────────────────────────────────────────────────
  // One fetch + immediate write-on-change for every <image-slot> on the
  // page. Reads via fetch() so viewing works anywhere the HTML and sidecar
  // are served together; writes go through window.omelette.writeFile, which
  // the host allowlists to *.state.json basenames only.
  const subs = new Set();
  let slots = {};
  // ids explicitly cleared before the sidecar fetch resolved — otherwise
  // the merge below can't tell "never set" from "just deleted" and would
  // resurrect the sidecar's stale value.
  const tombstones = new Set();
  let loaded = false;
  let loadP = null;

  function load() {
    if (loadP) return loadP;
    loadP = fetch(STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        // Merge: sidecar loses to any in-memory change that raced ahead of
        // the fetch (drop or clear) so neither is clobbered by hydration.
        if (j && typeof j === 'object') {
          const merged = Object.assign({}, j, slots);
          // A framing-only write that raced ahead of hydration must not
          // drop a user image that's only on disk — inherit u from the
          // sidecar for any in-memory entry that lacks one.
          for (const k in slots) {
            if (merged[k] && !merged[k].u && j[k]) {
              merged[k].u = typeof j[k] === 'string' ? j[k] : j[k].u;
            }
          }
          for (const id of tombstones) delete merged[id];
          slots = merged;
        }
        tombstones.clear();
      })
      .catch(() => {})
      .then(() => { loaded = true; subs.forEach((fn) => fn()); });
    return loadP;
  }

  // Serialize writes so two near-simultaneous drops on different slots
  // can't reorder at the backend and leave the sidecar with only the
  // first. A save requested mid-flight just marks dirty and re-fires on
  // completion with the then-current slots.
  let saving = false;
  let saveDirty = false;
  function save() {
    if (saving) { saveDirty = true; return; }
    const w = window.omelette && window.omelette.writeFile;
    if (!w) return;
    saving = true;
    Promise.resolve(w(STATE_FILE, JSON.stringify(slots)))
      .catch(() => {})
      .then(() => { saving = false; if (saveDirty) { saveDirty = false; save(); } });

    if (!v) return null;
    return typeof v === 'string' ? { u: v, s: 1, x: 0, y: 0 } : v;

    if (!id) return;
    if (val) { slots[id] = val; tombstones.delete(id); }

    // it. Gate on the initial read so we don't overwrite a sidecar we haven't
    // merged yet; the merge in load() keeps this change once the read lands.

  // for photos, so there's no need for per-image format picking.
  async function toDataUrl(file, targetW) {
    const bitmap = await createImageBitmap(file);
    try {
      const cap = Math.min(MAX_DIM, Math.max(1, Math.round(targetW * 2)) || MAX_DIM);
      const scale = Math.min(1, cap / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * scale));
      const h = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      return canvas.toDataURL('image/webp', 0.85);

      bitmap.close && bitmap.close();
    }

  // ── Custom element ──────────────────────────────────────────────────────
  const stylesheet =
    ':host{display:inline-block;position:relative;vertical-align:top;' +
    '  font:13px/1.3 system-ui,-apple-system,sans-serif;color:rgba(0,0,0,.55);width:240px;height:160px}' +
    '.frame{position:absolute;inset:0;overflow:hidden;background:rgba(0,0,0,.04)}' +
    // .frame img (clipped) and .spill (unclipped ghost + handles) share the
    // same left/top/width/height in frame-%, computed by _applyView(), so the
    // inside-mask crop and the outside-mask spill stay pixel-aligned.

    '  -webkit-user-drag:none;user-select:none;touch-action:none}' +
    // Reframe mode (double-click): the full image spills past the mask. The
    // spill layer is sized to the IMAGE bounds so its corners are where the
    // resize handles belong. The ghost <img> inside is translucent; the real
    // clipped <img> underneath shows the opaque in-mask crop.

    '  cursor:grab;touch-action:none}' +
    ':host([data-panning]) .spill{cursor:grabbing}' +
    '.spill .ghost{position:absolute;inset:0;width:100%;height:100%;opacity:.35;' +
    '  pointer-events:none;-webkit-user-drag:none;user-select:none;' +
    '  box-shadow:0 0 0 1px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.2)}' +
    '.spill .handle{position:absolute;width:12px;height:12px;border-radius:50%;' +
    '  background:#fff;box-shadow:0 0 0 1.5px #c96442,0 1px 3px rgba(0,0,0,.3);' +
    '  transform:translate(-50%,-50%)}' +
    '.spill .handle[data-c=nw]{left:0;top:0;cursor:nwse-resize}' +
    '.spill .handle[data-c=ne]{left:100%;top:0;cursor:nesw-resize}' +
    '.spill .handle[data-c=sw]{left:0;top:100%;cursor:nesw-resize}' +
    '.spill .handle[data-c=se]{left:100%;top:100%;cursor:nwse-resize}' +
    ':host([data-reframe]){z-index:10}' +
    ':host([data-reframe]) .spill{display:block}' +
    ':host([data-reframe]) .frame{box-shadow:0 0 0 2px #c96442}' +
    '.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
    '  justify-content:center;gap:6px;text-align:center;padding:12px;box-sizing:border-box;' +

    '.empty svg{opacity:.45}' +
    '.empty .cap{max-width:90%;font-weight:500;letter-spacing:.01em}' +
    '.empty .sub{font-size:11px}' +
    '.empty .sub u{text-underline-offset:2px;text-decoration-color:rgba(0,0,0,.25)}' +
    '.empty:hover .sub u{color:rgba(0,0,0,.75);text-decoration-color:currentColor}' +
    ':host([data-over]) .frame{outline:2px solid #c96442;outline-offset:-2px;' +

    '.ring{position:absolute;inset:0;pointer-events:none;border:1.5px dashed rgba(0,0,0,.25);' +

    ':host([data-over]) .ring{border-color:#c96442}' +
    ':host([data-filled]) .ring{display:none}' +
    // Controls sit BELOW the mask (top:100%), absolutely positioned so the
    // author-declared slot height is unaffected. The gap is padding, not a
    // top offset, so the hover target stays contiguous with the frame.
    '.ctl{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:8px;' +
    '  display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2;' +
    '  white-space:nowrap}' +
    ':host([data-filled][data-editable]:hover) .ctl,:host([data-reframe]) .ctl' +
    '  {opacity:1;pointer-events:auto}' +
    '.ctl button{appearance:none;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;' +
    '  background:rgba(0,0,0,.65);color:#fff;font:11px/1 system-ui,-apple-system,sans-serif;' +
    '  backdrop-filter:blur(6px)}' +
    '.ctl button:hover{background:rgba(0,0,0,.8)}' +
    '.err{position:absolute;left:8px;bottom:8px;right:8px;color:#b3261e;font-size:11px;' +
    '  background:rgba(255,255,255,.85);padding:4px 6px;border-radius:5px;pointer-events:none}';

  const icon =
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>' +
    '<path d="m21 15-5-5L5 21"/></svg>';

        '<div class="frame" part="frame">' +
        '  <img part="image" alt="" draggable="false" style="display:none">' +
        '  <div class="empty" part="empty">' + icon +
        '    <div class="cap"></div>' +
        '    <div class="sub">or <u>browse files</u></div></div>' +
        '  <div class="ring" part="ring"></div>' +
        '</div>' +
        '<div class="spill">' +
        '  <img class="ghost" alt="" draggable="false">' +
        '  <div class="handle" data-c="nw"></div><div class="handle" data-c="ne"></div>' +
        '  <div class="handle" data-c="sw"></div><div class="handle" data-c="se"></div>' +

        '<div class="ctl"><button data-act="replace" title="Replace image">Replace</button>' +

      this._gen = 0;

      // drives an aspect-locked resize anchored at the opposite corner; any
      // other pointerdown on the spill pans. Offsets are frame-% so a
      // reframed slot survives responsive resize / PPTX export.
      this._spill.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || !this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        e.stopPropagation();
        this._spill.setPointerCapture(e.pointerId);
        const rect = this.getBoundingClientRect();
        const fw = rect.width || 1, fh = rect.height || 1;
        const corner = e.target.getAttribute && e.target.getAttribute('data-c');
        let move;
        if (corner) {
          // Resize about the OPPOSITE corner. Viewport-px throughout (rect
          // fw/fh, not clientWidth) so the math survives a transform:scale()
          // ancestor — deck_stage renders slides scaled-to-fit.
          const iw = this._img.naturalWidth || 1, ih = this._img.naturalHeight || 1;
          const base = Math.max(fw / iw, fh / ih);
          const sx = corner.includes('e') ? 1 : -1;
          const sy = corner.includes('s') ? 1 : -1;
          const s0 = this._view.s;
          const w0 = iw * base * s0, h0 = ih * base * s0;
          const cx0 = (50 + this._view.x) / 100 * fw;
          const cy0 = (50 + this._view.y) / 100 * fh;
          const ox = cx0 - sx * w0 / 2, oy = cy0 - sy * h0 / 2;
          const diag0 = Math.hypot(w0, h0);
          const ux = sx * w0 / diag0, uy = sy * h0 / diag0;
          move = (ev) => {
            const proj = (ev.clientX - rect.left - ox) * ux +
                         (ev.clientY - rect.top - oy) * uy;
            const s = clampS(s0 * proj / diag0);
            const d = diag0 * s / s0;
            this._view.s = s;
            this._view.x = (ox + ux * d / 2) / fw * 100 - 50;
            this._view.y = (oy + uy * d / 2) / fh * 100 - 50;
            this._clampView();
            this._applyView();
          };
        } else {
          this.setAttribute('data-panning', '');
          const start = { px: e.clientX, py: e.clientY, x: this._view.x, y: this._view.y };
          move = (ev) => {
            this._view.x = start.x + (ev.clientX - start.px) / fw * 100;
            this._view.y = start.y + (ev.clientY - start.py) / fh * 100;
            this._clampView();
            this._applyView();
          };
        }
        const up = () => {
          try { this._spill.releasePointerCapture(e.pointerId); } catch {}
          this._spill.removeEventListener('pointermove', move);
          this._spill.removeEventListener('pointerup', up);
          this._spill.removeEventListener('pointercancel', up);
          this.removeAttribute('data-panning');
          this._dragUp = null;
        };
        // Stashed so _exitReframe (Escape / outside-click mid-drag) can
        // tear the capture + listeners down synchronously.
        this._dragUp = up;
        this._spill.addEventListener('pointermove', move);
        this._spill.addEventListener('pointerup', up);
        this._spill.addEventListener('pointercancel', up);
      });
      // Wheel zoom stays available inside reframe mode as a trackpad nicety —
      // zooms toward the cursor (offset' = cursor·(1-k) + offset·k).
      this.addEventListener('wheel', (e) => {
        if (!this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        const r = this.getBoundingClientRect();
        const cx = (e.clientX - r.left) / r.width * 100 - 50;
        const cy = (e.clientY - r.top) / r.height * 100 - 50;
        const prev = this._view.s;
        const next = clampS(prev * Math.pow(1.0015, -e.deltaY));
        if (next === prev) return;
        const k = next / prev;
        this._view.s = next;
        this._view.x = cx * (1 - k) + this._view.x * k;
        this._view.y = cy * (1 - k) + this._view.y * k;
        this._clampView();
        this._applyView();
      }, { passive: false });
    }

    connectedCallback() {
      // Warn once per page — an id-less slot works for the session but
      // cannot persist, and two id-less slots would share nothing.
      if (!this.id && !ImageSlot._warned) {
        ImageSlot._warned = true;
        console.warn('<image-slot> without an id will not persist its dropped image.');
      }
      this.addEventListener('dragenter', this);
      this.addEventListener('dragover', this);
      this.addEventListener('dragleave', this);
      this.addEventListener('drop', this);
      subs.add(this._subFn);
      // width%/height% in _applyView encode the frame aspect at call time —
      // a host resize (responsive grid, pane divider) would stretch the
      // image until the next _render. Re-render on size change: _render()
      // re-seeds _view from stored before clamp/apply, so a shrink→grow
      // cycle round-trips instead of ratcheting x/y toward the narrower
      // frame's clamp range.
      this._ro = new ResizeObserver(() => this._render());
      this._ro.observe(this);
      load();
      this._render();
    }

    disconnectedCallback() {
      subs.delete(this._subFn);
      this.removeEventListener('dragenter', this);
      this.removeEventListener('dragover', this);
      this.removeEventListener('dragleave', this);
      this.removeEventListener('drop', this);
      if (this._ro) { this._ro.disconnect(); this._ro = null; }
      this._exitReframe(false);
    }

    _enterReframe() {
      if (this.hasAttribute('data-reframe')) return;
      this.setAttribute('data-reframe', '');
      this._applyView();
      // Close on click outside (the spill handler stopPropagation()s so
      // in-image drags don't reach this) and on Escape. Listeners are held
      // on the instance so _exitReframe / disconnectedCallback can detach
      // exactly what was attached.
      this._outside = (e) => {
        if (e.composedPath && e.composedPath().includes(this)) return;
        this._exitReframe(true);
      };
      this._esc = (e) => { if (e.key === 'Escape') this._exitReframe(true); };
      document.addEventListener('pointerdown', this._outside, true);
      document.addEventListener('keydown', this._esc, true);
    }

    _exitReframe(commit) {
      if (!this.hasAttribute('data-reframe')) return;
      if (this._dragUp) this._dragUp();
      this.removeAttribute('data-reframe');
      this.removeAttribute('data-panning');
      if (this._outside) document.removeEventListener('pointerdown', this._outside, true);
      if (this._esc) document.removeEventListener('keydown', this._esc, true);
      this._outside = this._esc = null;
      if (commit) this._commitView();
    }

    attributeChangedCallback() { if (this.shadowRoot) this._render(); }

    // handleEvent — one listener object for all four drag events keeps the
    // add/remove symmetric and the depth counter correct.
    handleEvent(e) {

        // Without preventDefault the browser never fires 'drop'.
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        if (e.type === 'dragenter') this._depth++;
        this.setAttribute('data-over', '');
      } else if (e.type === 'dragleave') {
        // dragenter/leave fire for every descendant crossing — count depth
        // so hovering the icon inside the empty state doesn't flicker.
        if (--this._depth <= 0) { this._depth = 0; this.removeAttribute('data-over'); }
      } else if (e.type === 'drop') {
        e.preventDefault();
        e.stopPropagation();
        this._depth = 0;
        this.removeAttribute('data-over');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) this._ingest(f);
      }
    }

    async _ingest(file) {
      this._setError(null);
      if (!file || ACCEPT.indexOf(file.type) < 0) {
        this._setError('Drop a PNG, JPEG, WebP, or AVIF image.');
        return;
      }
      // toDataUrl can take hundreds of ms on a large photo. A Clear or a
      // newer drop during that window would be clobbered when this await
      // resumes — bump + capture a generation so stale encodes bail.
      const gen = ++this._gen;
      try {
        const w = this.clientWidth || this.offsetWidth || MAX_DIM;
        const url = await toDataUrl(file, w);
        if (gen !== this._gen) return;
        // Only exit reframe once the new image is in hand — a rejected type
        // or decode failure leaves the in-progress crop untouched.
        this._exitReframe(false);
        const val = { u: url, s: 1, x: 0, y: 0 };
        setSlot(this.id || '', val);
        // Keep a session-local copy for id-less slots so the drop still
        // shows, even though it cannot persist.
        if (!this.id) { this._local = val; this._render(); }
      } catch (err) {
        if (gen !== this._gen) return;
        this._setError('Could not read that image.');
        console.warn('<image-slot> ingest failed:', err);
      }
    }

    _setError(msg) {
      if (this._err) { this._err.remove(); this._err = null; }
      if (!msg) return;
      const d = document.createElement('div');
      d.className = 'err'; d.textContent = msg;
      this.shadowRoot.appendChild(d);
      this._err = d;
      setTimeout(() => { if (this._err === d) { d.remove(); this._err = null; } }, 3000);
    }

    // Reframing (pan/resize) is only meaningful for fit=cover — contain/fill
    // keep the old object-fit path and double-click is a no-op.
    _reframes() {
      return this.hasAttribute('data-filled') &&
        (this.getAttribute('fit') || 'cover') === 'cover';
    }

    // Cover-baseline geometry, shared by clamp/apply/resize. Null until the
    // img has loaded (naturalWidth is 0 before that) or when the slot has no
    // layout box — ResizeObserver fires with a 0×0 rect under display:none,
    // and clamping against a degenerate 1×1 frame would silently pull the
    // stored pan toward zero.
    _geom() {
      const iw = this._img.naturalWidth, ih = this._img.naturalHeight;
      const fw = this.clientWidth, fh = this.clientHeight;
      if (!iw || !ih || !fw || !fh) return null;
      return { iw, ih, fw, fh, base: Math.max(fw / iw, fh / ih) };
    }

    _clampView() {
      // Pan range on each axis is half the overflow past the frame edge.
      const g = this._geom();
      if (!g) return;
      const mx = Math.max(0, (g.iw * g.base * this._view.s / g.fw - 1) * 50);
      const my = Math.max(0, (g.ih * g.base * this._view.s / g.fh - 1) * 50);
      this._view.x = Math.max(-mx, Math.min(mx, this._view.x));
      this._view.y = Math.max(-my, Math.min(my, this._view.y));
    }

    _applyView() {
      const g = this._geom();
      const fit = this.getAttribute('fit') || 'cover';
      if (fit !== 'cover' || !g) {
        // Non-cover, or dimensions not known yet (before img load).
        this._img.style.width = '100%';
        this._img.style.height = '100%';
        this._img.style.left = '50%';
        this._img.style.top = '50%';
        this._img.style.objectFit = fit;
        this._img.style.objectPosition = this.getAttribute('position') || '50% 50%';
        return;
      }
      // Cover baseline: img fills the frame on its tighter axis at s=1, so
      // pan works immediately on the overflowing axis without zooming first.
      // Width/height and left/top are all frame-% — depends only on the
      // frame aspect ratio, so a responsive resize keeps the same crop. The
      // spill layer mirrors the same box so its corners = image corners.
      const k = g.base * this._view.s;
      const w = (g.iw * k / g.fw * 100) + '%';
      const h = (g.ih * k / g.fh * 100) + '%';
      const l = (50 + this._view.x) + '%';
      const t = (50 + this._view.y) + '%';
      this._img.style.width = w; this._img.style.height = h;
      this._img.style.left = l; this._img.style.top = t;
      this._img.style.objectFit = '';
      this._spill.style.width = w; this._spill.style.height = h;
      this._spill.style.left = l; this._spill.style.top = t;
    }

    _commitView() {
      const v = { s: this._view.s, x: this._view.x, y: this._view.y };
      if (this._userUrl) v.u = this._userUrl;
      // Framing-only (no u) persists too so an author-src slot remembers its
      // crop; clearing the sidecar still falls through to src=.
      if (this.id) setSlot(this.id, v);
      else { this._local = v; }
    }

    _render() {
      // Shape / mask. Presets use border-radius so the dashed ring can
      // follow the rounded outline; clip-path is only applied for an
      // explicit `mask` (the ring is hidden there since a rectangle
      // dashed border chopped by an arbitrary polygon looks broken).
      const mask = this.getAttribute('mask');
      const shape = (this.getAttribute('shape') || 'rounded').toLowerCase();
      let radius = '';
      if (shape === 'circle') radius = '50%';
      else if (shape === 'pill') radius = '9999px';
      else if (shape === 'rounded') {
        const n = parseFloat(this.getAttribute('radius'));
        radius = (Number.isFinite(n) ? n : 12) + 'px';
      }
      this._frame.style.borderRadius = mask ? '' : radius;
      this._frame.style.clipPath = mask || '';
      this._ring.style.borderRadius = mask ? '' : radius;
      this._ring.style.display = mask ? 'none' : '';

      // Controls and reframe entry gate on this so share links stay read-only.
      const editable = !!(window.omelette && window.omelette.writeFile);
      this.toggleAttribute('data-editable', editable);
      this._sub.style.display = editable ? '' : 'none';

      // Content. The sidecar is also writable by the agent's write_file
      // tool, so its value isn't guaranteed canvas-originated — only accept
      // data:image/ URLs from it. The `src` attribute is author-controlled
      // (Claude wrote it into the HTML) so it passes through unchanged.
      let stored = this.id ? getSlot(this.id) : this._local;
      if (stored && stored.u && !/^data:image\//i.test(stored.u)) stored = null;
      const srcAttr = this.getAttribute('src') || '';
      this._userUrl = (stored && stored.u) || null;
      const url = this._userUrl || srcAttr;
      // Don't clobber an in-flight reframe with a store-triggered re-render.
      if (!this.hasAttribute('data-reframe')) {
        this._view = {
          s: stored && Number.isFinite(stored.s) ? clampS(stored.s) : 1,
          x: stored && Number.isFinite(stored.x) ? stored.x : 0,
          y: stored && Number.isFinite(stored.y) ? stored.y : 0,
        };
      }
      this._cap.textContent = this.getAttribute('placeholder') || 'Drop an image';
      // Toggle via style.display — the [hidden] attribute alone loses to
      // the display:flex / display:block rules in the stylesheet above.
      if (url) {
        if (this._img.getAttribute('src') !== url) {
          this._img.src = url;
          this._ghost.src = url;
        }
        this._img.style.display = 'block';
        this._empty.style.display = 'none';
        this.setAttribute('data-filled', '');
        this._clampView();
        this._applyView();
      } else {
        this._img.style.display = 'none';
        this._img.removeAttribute('src');
        this._ghost.removeAttribute('src');
        this._empty.style.display = 'flex';
        this.removeAttribute('data-filled');
      }
    }
  }

  if (!customElements.get('image-slot')) {
    customElements.define('image-slot', ImageSlot);
  }
})();

document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href^="http"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;

  var w = null;
  try { w = window.open(a.href, '_blank'); if (w) w.opener = null; } catch (err) {}

}, true);

// Projector "intermission" — after idle, the site cuts to a silent-film title card
function Intermission({ idleMs = 120000 }) {
  const [on, setOn] = React.useState(false);
  const [i, setI] = React.useState(() => Math.floor(Math.random() * QUOTE_LIST.length));
  React.useEffect(() => {
    let t;
    const arm = () => { clearTimeout(t); t = setTimeout(() => { setI(n => (n + 1) % QUOTE_LIST.length); setOn(true); }, idleMs); };
    const wake = () => { setOn(false); arm(); };
    const evs = ['mousemove', 'keydown', 'scroll', 'touchstart', 'mousedown'];
    evs.forEach(e => window.addEventListener(e, wake, { passive: true }));
    arm();
    return () => { clearTimeout(t); evs.forEach(e => window.removeEventListener(e, wake)); };
  }, [idleMs]);
  React.useEffect(() => {
    if (!on) return;
    const id = setInterval(() => setI(n => (n + 1) % QUOTE_LIST.length), 7000);
    return () => clearInterval(id);
  }, [on]);
  const q = QUOTE_LIST[i];
  return (
    <div className={`intermission ${on ? 'on' : ''}`} aria-hidden={!on}>
      <div className="burn"></div>
      <div className="card" key={i}>
        <p className="q">“{q.q}”</p>
        <div className="src">{q.film} · {q.year}</div>
      </div>
      <div className="hint">— INTERMISSION · MOVE TO RESUME THE REEL —</div>
    </div>
  );
}

// End-credits crawl of every line
function CreditsCrawl() {
  const items = QUOTE_LIST;
  return (
    <div className="crawl">
      <div className="roll">
        <div className="item"><div className="t">Muse Studios presents</div><div className="q" style={{fontSize:44}}>The films that raised us</div></div>
        {items.map(x => (
          <div key={x.film} className="item">
            <div className="t">{x.film} · {x.year}</div>
            <div className="q">“{x.q}”</div>
          </div>
        ))}
        <div className="item"><div className="t">— Fin —</div></div>
      </div>
    </div>
  );
}

// A screenplay page that "quotes" a film as if it were dialogue from the shoot
function ScriptExcerpt({ quote, slug, action, who, paren, page = '14.' }) {
  return (
    <div className="script-page">
      <span className="pg">{page}</span>
      <div className="slug">{slug}</div>
      <div className="act">{action}</div>
      <div className="who">{who}</div>
      {paren && <div className="paren">({paren})</div>}
      <div className="dlg">{quote.q}</div>
      <div className="act" style={{marginTop:22,color:'var(--fg-3)'}}>Overheard on set. Lifted from <i>{quote.film}</i> ({quote.year}).</div>
    </div>
  );
}


// Stray subtitle — a line from a film surfaces at a random spot on screen,
// types itself out like a caption, lingers, then dissolves. Hover holds it.
function StrayQuotes({ firstMs = 6000, minGap = 14000, maxGap = 26000 }) {
  const [cur, setCur] = React.useState(null);
  const [n, setN] = React.useState(0);
  const [phase, setPhase] = React.useState('type');
  const held = React.useRef(false);
  const deck = React.useRef([]);
  const pick = () => {
    if (!deck.current.length) deck.current = [...QUOTE_LIST].sort(() => Math.random() - 0.5);
    return deck.current.pop();
  };
  const place = () => {
    const W = window.innerWidth, H = window.innerHeight, w = Math.min(440, W - 48);
    const zones = [[0.04, 0.12], [0.55, 0.14], [0.06, 0.62], [0.52, 0.66], [0.3, 0.4]];
    const [zx, zy] = zones[Math.floor(Math.random() * zones.length)];
    return { left: Math.max(24, Math.min(W - w - 24, zx * W + Math.random() * 60)), top: Math.max(80, Math.min(H - 200, zy * H + Math.random() * 40)) };
  };
  React.useEffect(() => {
    let t = setTimeout(function spawn() {
      if (document.hidden) { t = setTimeout(spawn, 4000); return; }
      setCur({ q: pick(), pos: place(), id: Date.now() }); setN(0); setPhase('type');
    }, firstMs);
    window.__strayNext = () => { clearTimeout(t); setCur({ q: pick(), pos: place(), id: Date.now() }); setN(0); setPhase('type'); };
    window.__straySchedule = () => { clearTimeout(t); t = setTimeout(window.__strayNext, minGap + Math.random() * (maxGap - minGap)); };
    return () => clearTimeout(t);
  }, []);
  React.useEffect(() => {
    if (!cur) return;
    const len = cur.q.q.length;
    if (phase === 'type') {
      if (n >= len) { setPhase('hold'); return; }
      const ch = cur.q.q[n];
      const t = setTimeout(() => setN(n + 1), /[.,;:!?]/.test(ch) ? 260 : 32 + Math.random() * 30);
      return () => clearTimeout(t);
    }
    if (phase === 'hold') {
      const t = setInterval(() => { if (!held.current) { clearInterval(t); setPhase('out'); } }, 3200 + len * 25);
      return () => clearInterval(t);
    }
    if (phase === 'out') {
      const t = setTimeout(() => { setCur(null); window.__straySchedule && window.__straySchedule(); }, 950);
      return () => clearTimeout(t);
    }
  }, [cur, n, phase]);
  if (!cur) return null;
  const chars = cur.q.q.split('');
  return (
    <div key={cur.id} className={`stray ${phase !== 'type' ? 'done' : ''} ${phase === 'out' ? 'out' : ''}`} style={cur.pos}
      onMouseEnter={() => { held.current = true; }} onMouseLeave={() => { held.current = false; }} aria-live="polite">
      <p className="q">“{chars.map((c, i) => <span key={i} className={`ch ${i < n ? 'on' : ''}`}>{c}</span>)}{phase === 'type' ? <span className="caret"></span> : '”'}</p>
      <span className="src">— {cur.q.film} · {cur.q.year}</span>
    </div>
  );
}

Object.assign(window, { QUOTES, QUOTE_LIST, StrayQuotes, Subtitle, Intermission, CreditsCrawl, ScriptExcerpt });

// ---------- MARQUEE ----------
function Marquee({ items, dir = 'l', dark }) {
  const content = items.concat(items).join('   ※   ');
  return (
    <div style={{overflow:'hidden',whiteSpace:'nowrap',borderTop:`1px solid ${dark ? 'var(--ink-60)' : 'var(--ink)'}`,borderBottom:`1px solid ${dark ? 'var(--ink-60)' : 'var(--ink)'}`,padding:'18px 0',background: dark ? 'var(--ink)' : 'transparent',color: dark ? 'var(--cream)' : 'var(--ink)'}}>
      <div style={{display:'inline-block',animation:`marq-${dir} 32s linear infinite`,fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:52,letterSpacing:'-0.02em'}}>
        {content}   ※   {content}
      </div>
      <style>{`
        @keyframes marq-l { from { transform: translateX(0); } to { transform: translateX(-50%); } }

      `}</style>
    </div>
  );
}

}

// ---------- STILLS CAROUSEL ----------
function StillsCarousel({ stills, title }) {
  const [i, setI] = useState(0);
  const n = stills.length;
  const go = d => setI(x => (x + d + n) % n);
  React.useEffect(() => {
    const k = e => { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, [n]);
  const arrow = {position:'absolute',top:'50%',transform:'translateY(-50%)',width:48,height:48,border:'1px solid var(--cream)',background:'rgba(14,13,11,0.55)',color:'var(--cream)',fontFamily:'var(--font-mono)',fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',zIndex:3};
  return (
    <div>
      <div className="eyebrow" style={{marginBottom:18,display:'flex',justifyContent:'space-between',gap:24}}>
        <span style={{whiteSpace:'nowrap',flexShrink:0}}>{`§ STILLS · ${String(i+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}`}</span>
        {n > 1 && <span style={{whiteSpace:'nowrap'}}>← → TO ADVANCE</span>}

      <div style={{position:'relative',aspectRatio:'16 / 9',background:'var(--ink)',border:'1px solid var(--ink)',overflow:'hidden'}}>
        <div style={{display:'flex',height:'100%',transform:`translateX(-${i*100}%)`,transition:'transform 600ms var(--ease-mech)'}}>
          {stills.map((src, k) => <img key={src} src={src} alt={`${title} — still ${k+1}`} style={{flex:'0 0 100%',width:'100%',height:'100%',objectFit:'cover',display:'block'}} />)}
        </div>
        {n > 1 && <button aria-label="Previous still" onClick={() => go(-1)} style={{...arrow,left:16}}>←</button>}
        {n > 1 && <button aria-label="Next still" onClick={() => go(1)} style={{...arrow,right:16}}>→</button>}
      </div>
      {n > 1 && <div style={{display:'flex',gap:12,marginTop:12}}>

          <button key={src} onClick={() => setI(k)} aria-label={`Still ${k+1}`} style={{padding:0,width:120,aspectRatio:'16 / 9',border:k===i?'2px solid var(--signal)':'1px solid var(--ink)',opacity:k===i?1:0.55,cursor:'pointer',background:'none',overflow:'hidden'}}>
            <img src={src} alt="" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}} />

}

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// --- Custom film-viewfinder cursor ---
function CursorFX() {
  const ret = useRef(); const dot = useRef();
  useEffect(() => {
    if (!window.matchMedia('(pointer: fine)').matches) return;
    let rx = window.innerWidth/2, ry = window.innerHeight/2, dx = rx, dy = ry, raf;
    const tick = () => {
      // reticle lags slightly behind, dot is exact — a focus-pull feel
      rx += (tx - rx) * 0.22; ry += (ty - ry) * 0.22;
      if (ret.current) ret.current.style.transform = `translate(${rx}px, ${ry}px)`;
      if (dot.current) dot.current.style.transform = `translate(${tx}px, ${ty}px)`;
      raf = requestAnimationFrame(tick);
    };
    let tx = rx, ty = ry;
    const move = (e) => {
      tx = e.clientX; ty = e.clientY;
      const hot = e.target.closest('a, button, [role="button"], .es-reel, .frame-card, .reel-card, [data-cursor-hot]');
      if (ret.current) ret.current.classList.toggle('is-hot', !!hot);
    };
    const down = () => ret.current && ret.current.classList.add('is-down');
    const up = () => ret.current && ret.current.classList.remove('is-down');
    const leave = () => { ret.current && ret.current.classList.add('cursor-hidden'); dot.current && dot.current.classList.add('cursor-hidden'); };
    const enter = () => { ret.current && ret.current.classList.remove('cursor-hidden'); dot.current && dot.current.classList.remove('cursor-hidden'); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mousedown', down);
    window.addEventListener('mouseup', up);
    document.addEventListener('mouseleave', leave);
    document.addEventListener('mouseenter', enter);
    raf = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('mousemove', move); window.removeEventListener('mousedown', down); window.removeEventListener('mouseup', up); document.removeEventListener('mouseleave', leave); document.removeEventListener('mouseenter', enter); };
  }, []);
  return (
    <>
      <div ref={ret} className="cursor-reticle">
        <span className="c-tl"></span><span className="c-tr"></span>
        <span className="c-bl"></span><span className="c-br"></span>
      </div>
      <div ref={dot} className="cursor-dot"></div>
    </>
  );
}

// --- grain + scroll-reveal wiring, re-run on each route ---
function useDynamicFX(route, closing) {
  useEffect(() => {
    document.body.classList.add('js-reveal');
    const t = setTimeout(() => {
      // 1) inject grain layers into cards/monitors
      document.querySelectorAll('.frame-card, .es-monitor, .es-reel .thumb, .reel-card .strip').forEach(el => {
        if (!el.querySelector(':scope > .grain-layer')) {
          const g = document.createElement('div'); g.className = 'grain-layer'; el.appendChild(g);
        }
      });
      // 2) tag sections for staggered scroll reveal + observe
      const io = new IntersectionObserver((entries) => {
        entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); } });
      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
      const secs = document.querySelectorAll('#app section');
      secs.forEach((s, i) => {
        if (!s.hasAttribute('data-reveal')) { s.setAttribute('data-reveal', ''); s.style.transitionDelay = (Math.min(i, 4) * 60) + 'ms'; }
        // reveal immediately if already in the viewport (don't wait on IO, which can be throttled)
        const rect = s.getBoundingClientRect();
        if (rect.top < window.innerHeight * 0.92) s.classList.add('is-in');
        else io.observe(s);
      });
      window.__museIO = io;
      // hard fallback: guarantee everything is visible shortly after, even if IO never fires
      window.__museFallback = setTimeout(() => { secs.forEach(s => s.classList.add('is-in')); }, 1100);
    }, 60);
    return () => { clearTimeout(t); clearTimeout(window.__museFallback); if (window.__museIO) window.__museIO.disconnect(); };
  }, [route, closing]);
}

function App() {
  const [route, setRoute] = useState('home');
  const [project, setProject] = useState(null);
  const [closing, setClosing] = useState(false);
  const pending = useRef(null);

  const navigate = useCallback((next, proj) => {
    if (next === route && proj === undefined) return;
    pending.current = { next, proj };
    setClosing(true);
    setTimeout(() => {
      const p = pending.current;
      if (p.proj !== undefined) setProject(p.proj);
      setRoute(p.next);
      window.scrollTo(0, 0);
      requestAnimationFrame(() => setClosing(false));
    }, 280);
  }, [route]);

  const go = useCallback((r) => navigate(r, undefined), [navigate]);
  const openCase = useCallback((p) => navigate('case', p), [navigate]);

  useDynamicFX(route, closing);

  // hidden tabs freeze CSS transitions — force-show content while hidden
  useEffect(() => {
    const sync = () => document.body.classList.toggle('fx-force', document.hidden);
    sync();
    document.addEventListener('visibilitychange', sync);
    return () => document.removeEventListener('visibilitychange', sync);
  }, []);

  return (
    <div data-screen-label={`Muse / ${route}`}>
      <CursorFX />
      <Intermission />
      <div className={`page-fx ${closing ? 'closing' : ''}`}>
        <div className="bar top"></div>
        <div className="bar bottom"></div>
        <div className="fx-readout"><span className="rec-dot"></span> CUT — {route.toUpperCase()}</div>
      </div>
      <TopNav route={route === 'case' ? 'work' : route} setRoute={go} />
      <div key={route} className="screen-enter">
        {route === 'home' && <HomeScreen setRoute={go} openCase={openCase} />}
        {route === 'work' && <WorkScreen openCase={openCase} />}
        {route === 'case' && <CaseScreen project={project} setRoute={go} />}
        {route === 'services' && <ServicesScreen />}
        {route === 'studio' && <StudioScreen />}
        {route === 'contact' && <ContactScreen />}
        <Footer go={go} openCase={openCase} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
